[OpenAI]
#
# OpenAI or Azure OpenAI Service
#

# Default options: openai, azure
API_TYPE=openai

# Check Azure's documentation for updates here:
# https://learn.microsoft.com/en-us/azure/ai-services/openai/chatgpt-quickstart?tabs=command-line&pivots=programming-language-python
AZURE_API_VERSION=2024-08-01-preview

#
# Model parameters
#

MODEL=gpt-5-mini
MAX_COMPLETION_TOKENS=128000
TIMEOUT=480
MAX_ATTEMPTS=5
WAITING_TIME=0
EXPONENTIAL_BACKOFF_FACTOR=5

EMBEDDING_MODEL=text-embedding-3-small 
AZURE_EMBEDDING_MODEL_API_VERSION=2023-05-15

CACHE_API_CALLS=False
CACHE_FILE_NAME=openai_api_cache.json

MAX_CONTENT_DISPLAY_LENGTH=1024

[Simulation]

PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True


RAI_HARMFUL_CONTENT_PREVENTION=True
RAI_COPYRIGHT_INFRINGEMENT_PREVENTION=True


# Webpage grounding inherits the secure defaults and starter hostname allowlist
# from tinytroupe/config.ini. See README.md, "Webpage grounding security".
# Investment Firm uses local-file grounding only and needs no extra hosts.
# URLs shown as advertising or persona content are not automatically fetched.
# Uncomment this example to replace that list with only docs.python.org.
# Other destinations, including redirects to unlisted hosts, will be rejected.
# [WebGrounding]
# ENFORCE_SECURITY=True
# ALLOWED_HOSTS=docs.python.org
# ALLOW_LOCALHOST=False
# ALLOW_PRIVATE_NETWORKS=False
# An empty ALLOWED_HOSTS blocks all pages. Avoid ENFORCE_SECURITY=False:
# it disables destination restrictions and permits internal network access.


[Logging]
LOGLEVEL=ERROR
LOGLEVEL_CONSOLE=ERROR
# ERROR
# WARNING
# INFO
# DEBUG

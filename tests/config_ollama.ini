# TinyTroupe Ollama config: dedicated ports 11444 and 11445 (dual agents).
# TinyTroupe spawns its own Ollama instances; no default port 11434.
# Use TINYTROUPE_CONFIG=tests/config_ollama.ini with pytest; Ollama is auto-started.
# Use a capable model (llama3.2:3b+ or gemma3:4b+); gemma3:1b is too small for complex scenarios.
[OpenAI]
API_TYPE=ollama
OLLAMA_BASE_URLS=http://127.0.0.1:11444/v1,http://127.0.0.1:11445/v1
# qwen-128k: long context (avoids truncation); nomic-embed-text for embeddings
MODEL=qwen-128k:latest
REASONING_MODEL=qwen-128k:latest
EMBEDDING_MODEL=nomic-embed-text
MAX_COMPLETION_TOKENS=8192
NUM_CTX=8192
